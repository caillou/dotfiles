# Neru: hints and scroll from the keyboard, the Homerow replacement.
#
# Only what differs from Neru's defaults is here; a key the file leaves out
# keeps its built-in default (docs/guide/configuring.md in the Neru repo).
# ⌘⇧Space for hints is Neru's own default, as are ⌘⇧S for scroll mode and
# ⌘⇧G for the grid. `neru config reload` applies an edit to the running
# daemon; `neru config init` prints every option with its default.

[hints]
# Every window on the screen, the menu bar and the Dock, the way Homerow
# labelled them, not only the focused window.
capture_scope = "screen"
include_menubar_hints = true
include_dock_hints = true

# Scrolling on j k i l (left, down, up, right), like the Karabiner right-⌘
# layer; the defaults' h and l for left and right keep working.
[scroll.hotkeys]
"j" = "action scroll_left"
"k" = "action scroll_down"
"i" = "action scroll_up"
"l" = "action scroll_right"

# Labels the way Homerow drew them: yellow, dark bold text, size 13. The
# typed prefix dims to a darker yellow; Neru's defaults are white on blue.
[hints.ui]
font_size = 13
border_radius = 4
background_color = "#F9D463"
border_color = "#C9A838"
text_color = "#1C1C1E"
matched_text_color = "#8A7430"
