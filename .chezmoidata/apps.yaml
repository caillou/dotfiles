# Desktop apps: one row per Homebrew cask and per App Store app.
#
# Casks and App Store apps are not in the Brewfile template. They are data
# because two scripts read them: run_after_10-packages appends the rows this
# machine should install to the rendered Brewfile, and run_after_90-report
# turns them into the "request via Self Service" list on a managed Mac.
#
# Fields:
#   kind   cask (Homebrew) or mas (App Store)
#   name   the Homebrew cask name, or the App Store id
#   app    the bundle in /Applications, empty when the package installs none
#          (ngrok is a binary). The packages script checks this to keep
#          `brew bundle` from adopting an app that was installed by hand.
#   group  core (every Mac), personal or embedded (behind the config flags)
#
# The list is the classification reviewed with the user, recorded in
# docs/PRDs/2026-09-10-chezmoi-mac-bootstrap/research-notes.md section 9, in
# that order. Fonts are casks too but live in the Brewfile: they install on
# every Mac, managed included.
#
# Homebrew renamed the `handbrake` cask to `handbrake-app`; the new name is
# used here so the Caskroom check below finds the directory Homebrew creates.

apps:
  # Core casks.
  - { kind: cask, name: "iterm2", app: "iTerm.app", group: core }
  - { kind: cask, name: "visual-studio-code", app: "Visual Studio Code.app", group: core }
  - { kind: cask, name: "google-chrome", app: "Google Chrome.app", group: core }
  - { kind: cask, name: "firefox", app: "Firefox.app", group: core }
  - { kind: cask, name: "hammerspoon", app: "Hammerspoon.app", group: core }
  - { kind: cask, name: "karabiner-elements", app: "Karabiner-Elements.app", group: core }
  - { kind: cask, name: "alfred", app: "Alfred 5.app", group: core }
  - { kind: cask, name: "istat-menus", app: "iStat Menus.app", group: core }
  - { kind: cask, name: "homerow", app: "Homerow.app", group: core }
  - { kind: cask, name: "the-unarchiver", app: "The Unarchiver.app", group: core }
  - { kind: cask, name: "docker-desktop", app: "Docker.app", group: core }
  - { kind: cask, name: "obsidian", app: "Obsidian.app", group: core }
  - { kind: cask, name: "slack", app: "Slack.app", group: core }
  - { kind: cask, name: "microsoft-teams", app: "Microsoft Teams.app", group: core }
  - { kind: cask, name: "ngrok", app: "", group: core }
