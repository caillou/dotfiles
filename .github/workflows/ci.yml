name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: brew install chezmoi bats-core parallel shellcheck fish uv

      - name: Initialise chezmoi from the checkout
        run: chezmoi init --source "$GITHUB_WORKSPACE" --promptDefaults

      - name: Tests
        run: bats --jobs "$(sysctl -n hw.ncpu)" tests

      # The Downloads view module, against a temporary .DS_Store. uv fetches
      # ds_store into a throwaway environment, the same way the apply script
      # runs the module.
      - name: Python tests
        run: uv run --with ds_store python3 -m unittest discover -s tests

      - name: Shellcheck the rendered scripts
        run: tests/shellcheck-scripts.sh

      - name: Secrets check
        run: tests/secrets-check.sh

      # Dry-run validates templates and file targets. chezmoi does not execute
      # scripts in dry-run; their content is covered by the steps above.
      - name: Dry-run apply
        run: chezmoi apply --dry-run --verbose
